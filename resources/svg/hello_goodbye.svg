  <!-- Popcorn at the top -->
  <circle cx="50" cy="45" r="10" fill="#ffd700"/>
  <circle cx="70" cy="40" r="12" fill="#ffec80"/>
  <circle cx="90" cy="45" r="10" fill="#ffd700"/>
